<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ポモドーロタイマー</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      font-size: 16px;
    }
    * { box-sizing: border-box; }
    body {
      --page-bg: #eaf2ff;
      --accent: #2563eb;
      --accent-dark: #1e40af;
      --accent-soft: #dbeafe;
      --ring-track: #e5eaf3;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 34px 18px;
      background: var(--page-bg);
      transition: background-color 350ms ease;
    }
    body[data-mode="break"] {
      --page-bg: #e7f8fc;
      --accent: #0891b2;
      --accent-dark: #0e7490;
      --accent-soft: #cffafe;
      --ring-track: #dcecf1;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(30px, 7vw, 56px) clamp(24px, 7vw, 48px) 38px;
      border: 1px solid #cbd7e8;
      border-radius: 32px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 18px 55px rgba(30, 64, 175, .12);
      text-align: center;
    }
    h1 {
      margin: 0 0 34px;
      font-size: clamp(1.8rem, 6vw, 2.35rem);
      line-height: 1.2;
      letter-spacing: .02em;
    }
    .timer-ring {
      --progress-angle: 360deg;
      position: relative;
      width: min(78vw, 350px);
      aspect-ratio: 1;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent) 0deg var(--progress-angle), var(--ring-track) var(--progress-angle) 360deg);
      box-shadow: 0 9px 24px rgba(37, 99, 235, .1);
    }
    .timer-ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: #fff;
    }
    .timer-content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
      place-items: center;
    }
    .mode {
      margin: 0;
      color: var(--accent-dark);
      font-size: 1.35rem;
      font-weight: 800;
    }
    .time {
      color: #171923;
      font-size: clamp(4.1rem, 17vw, 6.2rem);
      font-weight: 850;
      line-height: .95;
      letter-spacing: -.07em;
      font-variant-numeric: tabular-nums;
    }
    .notice {
      min-height: 1.5em;
      margin: 0 0 22px;
      color: var(--accent-dark);
      font-size: 1.1rem;
      font-weight: 800;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    button, input { font: inherit; }
    button {
      min-height: 54px;
      border: 1px solid #c6d1e1;
      border-radius: 14px;
      padding: 11px 10px;
      color: #172033;
      background: #fff;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:hover { background: #f4f7fb; }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, .switch input:focus-visible + .slider {
      outline: 3px solid #60a5fa;
      outline-offset: 3px;
    }
    .primary {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }
    .primary:hover { background: var(--accent-dark); }
    .count { margin: 24px 0; font-weight: 700; }
    .count strong {
      color: var(--accent-dark);
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
    }
    .settings {
      padding-top: 24px;
      border-top: 1px solid #d6deea;
      text-align: left;
    }
    .duration-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    label { font-weight: 750; }
    input[type="number"] {
      width: 100%;
      min-height: 49px;
      margin-top: 9px;
      padding: 10px 13px;
      border: 1px solid #b8c5d8;
      border-radius: 12px;
      color: #172033;
      background: #fff;
      font-weight: 650;
    }
    .sound-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 22px;
    }
    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 750;
    }
    .switch { position: relative; display: inline-flex; cursor: pointer; }
    .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .slider {
      width: 46px;
      height: 27px;
      padding: 3px;
      border-radius: 999px;
      background: #94a3b8;
      transition: background-color 180ms ease;
    }
    .slider::after {
      content: "";
      display: block;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .22);
      transition: transform 180ms ease;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::after { transform: translateX(19px); }
    .test-sound { min-height: 44px; padding: 8px 15px; }
    .hint {
      margin: 16px 0 0;
      color: #5c6677;
      font-size: .9rem;
      line-height: 1.5;
    }
    body.flash main { animation: flash 700ms ease-out; }
    @keyframes flash {
      0%, 100% { box-shadow: 0 18px 55px rgba(30, 64, 175, .12); }
      35% { box-shadow: 0 0 0 8px var(--accent-soft), 0 18px 55px rgba(30, 64, 175, .18); }
    }
    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      main { padding: 30px 18px; border-radius: 24px; }
      h1 { margin-bottom: 28px; }
      .timer-ring { width: min(80vw, 310px); }
      .controls { gap: 7px; }
      button { min-height: 50px; padding-inline: 6px; }
    }
    @media (max-width: 360px) {
      .controls, .duration-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body data-mode="focus">
  <main>
    <h1>ポモドーロタイマー</h1>
    <div class="timer-ring" id="timerRing" role="timer" aria-label="残り時間 25分00秒">
      <div class="timer-content">
        <p class="mode" id="modeLabel">集中</p>
        <div class="time" id="timeDisplay">25:00</div>
      </div>
    </div>
    <p class="notice" id="notice" aria-live="assertive">準備ができたら開始してください</p>
    <div class="controls" aria-label="タイマー操作">
      <button class="primary" id="startButton" type="button">開始</button>
      <button id="pauseButton" type="button">一時停止</button>
      <button id="resetButton" type="button">リセット</button>
    </div>
    <p class="count">完了した集中 <strong id="completedCount">0</strong> 回</p>
    <section class="settings" aria-label="タイマー設定">
      <div class="duration-grid">
        <label>集中（分）
          <input id="focusMinutes" type="number" min="1" max="99" step="1" value="25" inputmode="numeric">
        </label>
        <label>休憩（分）
          <input id="breakMinutes" type="number" min="1" max="99" step="1" value="5" inputmode="numeric">
        </label>
      </div>
      <div class="sound-row">
        <div class="switch-label">
          <label class="switch">
            <input id="soundToggle" type="checkbox" checked role="switch" aria-label="お知らせ音">
            <span class="slider" aria-hidden="true"></span>
          </label>
          <span id="soundState">音を鳴らす</span>
        </div>
        <button class="test-sound" id="testSoundButton" type="button">テスト音</button>
      </div>
      <p class="hint">1〜99分。開始後の変更は次の時間帯から反映されます。</p>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const el = {
        body: document.body,
        ring: document.getElementById("timerRing"),
        mode: document.getElementById("modeLabel"),
        time: document.getElementById("timeDisplay"),
        notice: document.getElementById("notice"),
        start: document.getElementById("startButton"),
        pause: document.getElementById("pauseButton"),
        reset: document.getElementById("resetButton"),
        focus: document.getElementById("focusMinutes"),
        rest: document.getElementById("breakMinutes"),
        sound: document.getElementById("soundToggle"),
        soundState: document.getElementById("soundState"),
        test: document.getElementById("testSoundButton"),
        count: document.getElementById("completedCount")
      };
      let mode = "focus";
      let remaining = 25 * 60;
      let duration = remaining;
      let endTime = 0;
      let timerId = null;
      let running = false;
      let started = false;
      let completed = 0;
      let audioContext = null;

      function minutes(input, fallback) {
        const value = Math.round(Number(input.value));
        const safe = Number.isFinite(value) ? Math.min(99, Math.max(1, value)) : fallback;
        input.value = String(safe);
        return safe;
      }
      function durationFor(nextMode) {
        return minutes(nextMode === "focus" ? el.focus : el.rest, nextMode === "focus" ? 25 : 5) * 60;
      }
      function format(seconds) {
        const safe = Math.max(0, seconds);
        return `${String(Math.floor(safe / 60)).padStart(2, "0")}:${String(safe % 60).padStart(2, "0")}`;
      }
      function render() {
        const ratio = duration > 0 ? Math.min(1, Math.max(0, remaining / duration)) : 0;
        el.body.dataset.mode = mode;
        el.mode.textContent = mode === "focus" ? "集中" : "休憩";
        el.time.textContent = format(remaining);
        el.ring.style.setProperty("--progress-angle", `${ratio * 360}deg`);
        el.ring.setAttribute("aria-label", `残り時間 ${Math.floor(remaining / 60)}分${remaining % 60}秒`);
        document.title = `${format(remaining)}｜${mode === "focus" ? "集中" : "休憩"}`;
      }
      function beep() {
        if (!el.sound.checked) return;
        const Audio = window.AudioContext || window.webkitAudioContext;
        if (!Audio) {
          el.notice.textContent = "このブラウザでは音を再生できません";
          return;
        }
        audioContext ||= new Audio();
        if (audioContext.state === "suspended") audioContext.resume();
        const now = audioContext.currentTime;
        [0, .18].forEach((delay) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.frequency.setValueAtTime(880, now + delay);
          gain.gain.setValueAtTime(.0001, now + delay);
          gain.gain.exponentialRampToValueAtTime(.16, now + delay + .015);
          gain.gain.exponentialRampToValueAtTime(.0001, now + delay + .12);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now + delay);
          oscillator.stop(now + delay + .13);
        });
      }
      function stopTimer() {
        if (timerId !== null) clearInterval(timerId);
        timerId = null;
      }
      function announceChange() {
        el.notice.textContent = mode === "break" ? "集中完了！休憩を始めます" : "休憩終了！集中を始めます";
        el.body.classList.remove("flash");
        void el.body.offsetWidth;
        el.body.classList.add("flash");
        setTimeout(() => el.body.classList.remove("flash"), 750);
        beep();
      }
      function switchMode() {
        if (mode === "focus") {
          completed += 1;
          el.count.textContent = String(completed);
          mode = "break";
        } else {
          mode = "focus";
        }
        duration = durationFor(mode);
        remaining = duration;
        endTime = Date.now() + remaining * 1000;
        announceChange();
        render();
      }
      function tick() {
        const next = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
        if (next !== remaining) {
          remaining = next;
          render();
        }
        if (remaining === 0) switchMode();
      }
      function start() {
        if (running) return;
        running = true;
        started = true;
        endTime = Date.now() + remaining * 1000;
        el.start.textContent = "実行中";
        el.notice.textContent = mode === "focus" ? "集中しましょう" : "休憩しましょう";
        stopTimer();
        timerId = setInterval(tick, 250);
        tick();
      }
      function pause() {
        if (!running) return;
        tick();
        running = false;
        stopTimer();
        el.start.textContent = "再開";
        el.notice.textContent = "一時停止中です";
      }
      function reset() {
        running = false;
        started = false;
        stopTimer();
        mode = "focus";
        duration = durationFor("focus");
        remaining = duration;
        completed = 0;
        el.count.textContent = "0";
        el.start.textContent = "開始";
        el.notice.textContent = "準備ができたら開始してください";
        render();
      }
      function updateDurations() {
        minutes(el.focus, 25);
        minutes(el.rest, 5);
        if (!started) {
          duration = durationFor("focus");
          remaining = duration;
          render();
        }
      }
      el.start.addEventListener("click", start);
      el.pause.addEventListener("click", pause);
      el.reset.addEventListener("click", reset);
      el.focus.addEventListener("change", updateDurations);
      el.rest.addEventListener("change", updateDurations);
      el.sound.addEventListener("change", () => {
        el.soundState.textContent = el.sound.checked ? "音を鳴らす" : "音を鳴らさない";
        el.notice.textContent = el.sound.checked ? "お知らせ音をオンにしました" : "お知らせ音をオフにしました";
      });
      el.test.addEventListener("click", () => {
        if (el.sound.checked) {
          el.notice.textContent = "テスト音を再生しました";
          beep();
        } else {
          el.notice.textContent = "音がオフになっています";
        }
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && running) tick();
      });
      render();
    })();
  </script>
</body>
</html>
