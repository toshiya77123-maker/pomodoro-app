<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>テレプロンプター</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(18, 18, 20, 0.94);
      --line: #3b3b42;
      --accent: #42a5ff;
      --text-size: 64px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
    }

    button, textarea, input { font: inherit; }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #readingGuide {
      position: absolute;
      z-index: 2;
      top: 42%;
      left: 0;
      width: 100%;
      height: 2px;
      background: #d6a52d;
      box-shadow: 0 0 6px rgba(214, 165, 45, 0.28);
      pointer-events: none;
    }

    #script {
      position: absolute;
      top: 0;
      left: 7vw;
      width: 86vw;
      margin: 0;
      color: #fff;
      font-size: var(--text-size);
      font-weight: 650;
      line-height: 1.55;
      letter-spacing: 0.02em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: left;
      transform: translateY(100vh);
      transform-origin: center center;
      will-change: transform;
    }

    #script.mirrored { transform: translateY(100vh) scaleX(-1); }

    #toolbar {
      position: fixed;
      z-index: 10;
      top: 14px;
      left: 50%;
      width: min(1120px, calc(100vw - 28px));
      transform: translateX(-50%);
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.5);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    #toolbar.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -18px);
    }

    .toolbar-header, .controls, .buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toolbar-header { margin-bottom: 10px; }
    .toolbar-header h1 { margin: 0; font-size: 18px; }
    .toolbar-header p { margin: 0 0 0 auto; color: #b8b8c2; font-size: 12px; }

    textarea {
      display: block;
      width: 100%;
      min-height: 112px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #52525b;
      border-radius: 9px;
      outline: none;
      background: #08080a;
      color: #fff;
      line-height: 1.5;
    }

    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66, 165, 255, 0.2); }

    .controls { flex-wrap: wrap; margin-top: 10px; }
    .control { display: flex; align-items: center; gap: 8px; min-width: 235px; flex: 1; }
    .control label { white-space: nowrap; font-size: 14px; }
    .control output { min-width: 68px; color: #c9e6ff; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    .buttons { flex-wrap: wrap; margin-top: 10px; }

    button {
      min-height: 42px;
      padding: 8px 15px;
      border: 1px solid #55555e;
      border-radius: 9px;
      background: #29292f;
      color: #fff;
      cursor: pointer;
    }

    button:hover { background: #36363e; }
    button:focus-visible { outline: 3px solid rgba(66, 165, 255, 0.55); outline-offset: 2px; }
    button.primary { border-color: #1489e8; background: #0877cf; font-weight: 700; }
    button.primary:hover { background: #0b8bf0; }
    button[aria-pressed="true"] { border-color: #78c3ff; background: #164c73; }
    #status { margin-left: auto; color: #b8b8c2; font-size: 13px; }

    #showToolbar {
      position: fixed;
      z-index: 11;
      top: 14px;
      right: 14px;
      opacity: 0;
      pointer-events: none;
      background: rgba(25, 25, 28, 0.88);
    }

    #showToolbar.visible { opacity: 1; pointer-events: auto; }

    @media (max-width: 680px) {
      #toolbar { top: 8px; width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow-y: auto; }
      .toolbar-header p { display: none; }
      .control { min-width: 100%; }
      #status { width: 100%; margin-left: 0; }
      #script { left: 5vw; width: 90vw; }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="テレプロンプター表示領域">
    <div id="readingGuide" aria-hidden="true"></div>
    <div id="script" aria-live="off"></div>
  </main>

  <section id="toolbar" aria-label="操作パネル">
    <div class="toolbar-header">
      <h1>テレプロンプター</h1>
      <p>原稿はこのブラウザ内だけに保存されます</p>
    </div>
    <label for="source">原稿</label>
    <textarea id="source" placeholder="ここに原稿を貼り付けてください" spellcheck="true"></textarea>

    <div class="controls">
      <div class="control">
        <label for="speed">速度</label>
        <input id="speed" type="range" min="10" max="200" value="55" step="5">
        <output id="speedValue" for="speed">55 px/秒</output>
      </div>
      <div class="control">
        <label for="fontSize">文字サイズ</label>
        <input id="fontSize" type="range" min="28" max="120" value="64" step="2">
        <output id="fontSizeValue" for="fontSize">64 px</output>
      </div>
    </div>

    <div class="buttons">
      <button id="start" class="primary" type="button">スタート</button>
      <button id="pause" type="button">一時停止</button>
      <button id="reset" type="button">先頭に戻す</button>
      <button id="mirror" type="button" aria-pressed="false">左右反転：オフ</button>
      <button id="fullscreen" type="button">全画面表示</button>
      <button id="hideToolbar" type="button">操作パネルを隠す</button>
      <span id="status" role="status">停止中</span>
    </div>
  </section>

  <button id="showToolbar" type="button">操作パネルを表示</button>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "teleprompter-script-v1";
      const SETTINGS_KEY = "teleprompter-settings-v1";
      const source = document.getElementById("source");
      const script = document.getElementById("script");
      const speed = document.getElementById("speed");
      const fontSize = document.getElementById("fontSize");
      const speedValue = document.getElementById("speedValue");
      const fontSizeValue = document.getElementById("fontSizeValue");
      const startButton = document.getElementById("start");
      const pauseButton = document.getElementById("pause");
      const resetButton = document.getElementById("reset");
      const mirrorButton = document.getElementById("mirror");
      const fullscreenButton = document.getElementById("fullscreen");
      const toolbar = document.getElementById("toolbar");
      const hideToolbarButton = document.getElementById("hideToolbar");
      const showToolbarButton = document.getElementById("showToolbar");
      const status = document.getElementById("status");

      let position = window.innerHeight;
      let playing = false;
      let lastTime = 0;
      let animationId = 0;
      let mirrored = false;
      let saveTimer = 0;

      function safeLoad() {
        try {
          source.value = localStorage.getItem(STORAGE_KEY) || "";
          const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
          if (settings.speed) speed.value = settings.speed;
          if (settings.fontSize) fontSize.value = settings.fontSize;
          mirrored = Boolean(settings.mirrored);
        } catch (_) {
          // 保存機能を使えない環境でも、テレプロンプター自体は動作させる。
        }
      }

      function safeSave() {
        try {
          localStorage.setItem(STORAGE_KEY, source.value);
          localStorage.setItem(SETTINGS_KEY, JSON.stringify({
            speed: speed.value,
            fontSize: fontSize.value,
            mirrored
          }));
        } catch (_) {
          status.textContent = "保存できないブラウザ設定です";
        }
      }

      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(safeSave, 250);
      }

      function updateScriptText() {
        script.textContent = source.value || "原稿を入力してください";
      }

      function render() {
        const mirrorTransform = mirrored ? " scaleX(-1)" : "";
        script.style.transform = `translateY(${position}px)${mirrorTransform}`;
      }

      function updateSettingsDisplay() {
        speedValue.value = `${speed.value} px/秒`;
        fontSizeValue.value = `${fontSize.value} px`;
        document.documentElement.style.setProperty("--text-size", `${fontSize.value}px`);
        script.classList.toggle("mirrored", mirrored);
        mirrorButton.setAttribute("aria-pressed", String(mirrored));
        mirrorButton.textContent = `左右反転：${mirrored ? "オン" : "オフ"}`;
        render();
      }

      function setPlaying(nextPlaying) {
        if (nextPlaying && source.value.trim() === "") {
          status.textContent = "原稿を入力してください";
          source.focus();
          return;
        }

        playing = nextPlaying;
        status.textContent = playing ? "再生中（スペースキーで一時停止）" : "一時停止中";
        startButton.textContent = playing ? "再生中" : "スタート";
        startButton.setAttribute("aria-pressed", String(playing));
        lastTime = performance.now();

        if (playing && !animationId) animationId = requestAnimationFrame(tick);
      }

      function tick(now) {
        animationId = 0;
        if (!playing) return;

        const elapsed = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        position -= Number(speed.value) * elapsed;
        render();

        if (position < -script.offsetHeight) {
          playing = false;
          status.textContent = "原稿の最後です";
          startButton.textContent = "スタート";
          startButton.setAttribute("aria-pressed", "false");
          return;
        }

        animationId = requestAnimationFrame(tick);
      }

      function resetToStart() {
        playing = false;
        position = window.innerHeight;
        status.textContent = "先頭に戻しました";
        startButton.textContent = "スタート";
        startButton.setAttribute("aria-pressed", "false");
        render();
      }

      function toggleToolbar(show) {
        toolbar.classList.toggle("hidden", !show);
        showToolbarButton.classList.toggle("visible", !show);
        showToolbarButton.setAttribute("aria-hidden", String(show));
      }

      source.addEventListener("input", () => {
        updateScriptText();
        scheduleSave();
      });

      speed.addEventListener("input", () => {
        updateSettingsDisplay();
        scheduleSave();
      });

      fontSize.addEventListener("input", () => {
        updateSettingsDisplay();
        scheduleSave();
      });

      startButton.addEventListener("click", () => setPlaying(true));
      pauseButton.addEventListener("click", () => setPlaying(false));
      resetButton.addEventListener("click", resetToStart);
      mirrorButton.addEventListener("click", () => {
        mirrored = !mirrored;
        updateSettingsDisplay();
        safeSave();
      });

      fullscreenButton.addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        } catch (_) {
          status.textContent = "全画面表示を開始できませんでした";
        }
      });

      document.addEventListener("fullscreenchange", () => {
        fullscreenButton.textContent = document.fullscreenElement ? "全画面を終了" : "全画面表示";
      });

      hideToolbarButton.addEventListener("click", () => toggleToolbar(false));
      showToolbarButton.addEventListener("click", () => toggleToolbar(true));

      document.addEventListener("keydown", (event) => {
        const target = event.target;
        const isEditing = target instanceof HTMLTextAreaElement ||
          target instanceof HTMLInputElement || target instanceof HTMLButtonElement;
        if (event.code === "Space" && !isEditing) {
          event.preventDefault();
          setPlaying(!playing);
        }
        if (event.key === "Escape" && toolbar.classList.contains("hidden")) {
          toggleToolbar(true);
        }
      });

      window.addEventListener("resize", () => {
        if (!playing && position > 0) position = window.innerHeight;
        render();
      });

      safeLoad();
      updateScriptText();
      updateSettingsDisplay();
      resetToStart();
    })();
  </script>
</body>
</html>
